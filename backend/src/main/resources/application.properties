# ?????????????????????????????????????????????????????????????????
#  PASSWORD RESET
# ?????????????????????????????????????????????????????????????????
app.password-reset.token-validity-minutes=30
app.password-reset.frontend-url=http://localhost:4200

# ?????????????????????????????????????????????????????????????????
#  ONE-SHOT DATA SEEDER
#  When TRUE on startup: wipes EVERY application table and reseeds
#  categories + a demo seller + 40 products. Set back to FALSE after
#  it runs once, otherwise it will wipe the DB on every restart.
# ?????????????????????????????????????????????????????????????????
app.seed.run=false

# ?????????????????????????????????????????????????????????????????
#  LOGGING
