spring.application.name=backend

# ?????????????????????????????????????????????????????????????????
#  SERVER
# ?????????????????????????????????????????????????????????????????
server.port=8181

# ?????????????????????????????????????????????????????????????????
#  DATABASE  (MySQL)
# ?????????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/myprojectdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Santoshjee@14
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????????????????????????????????????????????????????????????
#  JPA / HIBERNATE
# ?????????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?????????????????????????????????????????????????????????????????
#  JWT
#  Secret must be at least 32 characters for HS256.
#  Expiry: 86400000 ms = 24 hours
# ?????????????????????????????????????????????????????????????????
jwt.secret=OpenCartSuperSecretJwtKey2024!ChangeThisInProduction!
jwt.expiration-ms=86400000

# ?????????????????????????????????????????????????????????????????
#  JACKSON  (prevents infinite recursion on bidirectional entities)
# ?????????????????????????????????????????????????????????????????
spring.jackson.serialization.fail-on-empty-beans=false

