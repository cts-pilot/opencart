<!-- TOP NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <span class="brand-text">OpenCart</span>
    </a>

    <!-- Search Bar -->
    <div class="flex-grow-1 mx-3 d-none d-lg-block" *ngIf="currentUser?.role !== 'seller'">
      <div class="input-group">
        <input
          #searchInput
          type="text"
          class="form-control"
          placeholder="Search products..."
          (keyup.enter)="applySearch(searchInput.value)"
        >
        <button class="btn search-btn" type="button" (click)="applySearch(searchInput.value)" aria-label="Search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15.5 14h-.79l-.28-.27a6 6 0 1 0-.71.71l.27.28v.79L20 20.49 21.49 19zM10 15.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Content -->
    <div class="collapse navbar-collapse justify-content-end" id="topNav">
      <ul class="navbar-nav align-items-center gap-3">

        <!-- My Account / User Profile -->
        <div class="dropdown" *ngIf="!currentUser">
          <span (click)="toggleAccount()" class="cursor-pointer">👤 My Account ▾</span>
          <div class="menu" *ngIf="showAccount">
            <a routerLink="/register">Register</a>
            <a routerLink="/login">Login</a>
          </div>
        </div>

        <!-- User Profile (when logged in) -->
        <div class="dropdown" *ngIf="currentUser">
          <span (click)="toggleUserProfile()" class="cursor-pointer">
            👤 Profile ▾
          </span>
          <div class="menu user-menu" *ngIf="showUserProfile">
            <div class="user-info">
              <div class="user-title">User Details</div>
              <div class="detail-row">
                <span class="detail-label">First name</span>
                <span class="detail-value">{{ currentUser.fname }}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Last name</span>
                <span class="detail-value">{{ currentUser.lname }}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email</span>
                <span class="detail-value">{{ currentUser.email }}</span>
              </div>
            </div>
            <hr class="menu-divider">
            <a
              class="menu-item"
              [routerLink]="currentUser.role === 'seller' ? '/seller/profile' : '/profile'"
            >
              Profile
            </a>
            <a
              class="menu-item"
              [routerLink]="currentUser.role === 'seller' ? '/seller/orders' : '/orders'"
            >
              Orders
            </a>
            <a class="menu-item logout" (click)="logout()">Logout</a>
          </div>
        </div>

        <!-- Wishlist -->
        <li class="nav-item" *ngIf="currentUser?.role !== 'seller'">
          <a class="nav-link wishlist-link" routerLink="/wishlist" aria-label="Wishlist">
            <i class="bi bi-heart"></i> Wishlist ({{ wishlistCount }})
          </a>
        </li>

        <!-- Cart -->
        <li class="nav-item" *ngIf="currentUser?.role !== 'seller'">
          <a class="nav-link cart-icon-only" routerLink="/cart" aria-label="Shopping cart">
            <span class="cart-icon-symbol" aria-hidden="true">🛒</span>
            <span class="cart-count" *ngIf="cartCount">{{ cartCount }}</span>
          </a>
        </li>
      </ul>
    </div>

  </div>
</nav>
