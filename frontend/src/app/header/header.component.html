<!-- TOP NAVBAR -->
<nav class="app-header">
  <div class="header-inner">

    <!-- Logo -->
    <a class="brand" routerLink="/">
      <span class="brand-mark">OC</span>
      <span class="brand-text">OpenCart</span>
    </a>

    <!-- Search Bar -->
    <div class="search-shell" *ngIf="currentUser?.role !== 'seller'">
      <span class="search-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="search-icon">
          <path d="M15.5 14h-.79l-.28-.27a6 6 0 1 0-.71.71l.27.28v.79L20 20.49 21.49 19zM10 15.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
        </svg>
      </span>
      <input
        #searchInput
        type="text"
        class="search-input"
        placeholder="Search products, brands and more…"
        (keyup.enter)="applySearch(searchInput.value)"
      >
      <button class="search-submit" type="button" (click)="applySearch(searchInput.value)" aria-label="Search">
        Search
      </button>
    </div>

    <!-- Right cluster -->
    <div class="header-nav">

      <!-- My Account (guest) -->
      <div class="dropdown" *ngIf="!currentUser">
        <button type="button" class="nav-pill" (click)="toggleAccount()">
          <span class="pill-icon">👤</span>
          <span class="pill-text">My Account</span>
          <span class="caret">▾</span>
        </button>
        <div class="menu" *ngIf="showAccount">
          <a class="menu-item" routerLink="/register"><span class="mi-icon">📝</span> Register</a>
          <a class="menu-item" routerLink="/login"><span class="mi-icon">🔑</span> Login</a>
        </div>
      </div>

      <!-- User Profile (logged in) -->
      <div class="dropdown" *ngIf="currentUser">
        <button type="button" class="nav-pill" (click)="toggleUserProfile()">
          <span class="avatar">{{ (currentUser.fname || '?').charAt(0).toUpperCase() }}</span>
          <span class="pill-text">{{ currentUser.fname }}</span>
          <span class="caret">▾</span>
        </button>
        <div class="menu user-menu" *ngIf="showUserProfile">
          <div class="user-info">
            <div class="user-title">Signed in as</div>
            <div class="user-name">{{ currentUser.fname }} {{ currentUser.lname }}</div>
            <div class="user-email">{{ currentUser.email }}</div>
          </div>
          <a class="menu-item" [routerLink]="currentUser.role === 'seller' ? '/seller/profile' : '/profile'">
            <span class="mi-icon">👤</span> Profile
          </a>
          <a class="menu-item" [routerLink]="currentUser.role === 'seller' ? '/seller/orders' : '/orders'">
            <span class="mi-icon">📦</span> Orders
          </a>
          <a class="menu-item logout" (click)="logout()">
            <span class="mi-icon">🚪</span> Logout
          </a>
        </div>
      </div>

      <!-- Wishlist -->
      <a class="icon-btn" routerLink="/wishlist" *ngIf="currentUser?.role !== 'seller'" aria-label="Wishlist">
        <span class="ib-icon">♥</span>
        <span class="ib-badge" *ngIf="wishlistCount">{{ wishlistCount }}</span>
      </a>

      <!-- Cart -->
      <a class="icon-btn cart" routerLink="/cart" *ngIf="currentUser?.role !== 'seller'" aria-label="Shopping cart">
        <span class="ib-icon">🛒</span>
        <span class="ib-badge amber" *ngIf="cartCount">{{ cartCount }}</span>
      </a>

    </div>
  </div>
</nav>
