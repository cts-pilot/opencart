<div class="seller-page">
  <div class="page-header">
    <h2>Seller Orders</h2>
    <div class="nav-links">
      <a routerLink="/seller">Dashboard</a>
      <a routerLink="/seller/products">Products</a>
      <a routerLink="/seller/profile">Profile</a>
    </div>
  </div>

  <div class="loading" *ngIf="isLoading">Loading orders...</div>
  <div class="empty" *ngIf="!isLoading && !orders.length">No orders found.</div>

  <div class="order-card" *ngFor="let order of orders">
    <img [src]="order.product.productUrl" alt="{{ order.product.productName }}">
    <div class="order-info">
      <h4>{{ order.product.productName }}</h4>
      <p>
        Customer: {{ order.order?.user?.firstName ? (order.order?.user?.firstName + ' ' + order.order?.user?.lastName) : '—' }}
      </p>
      <p>Qty: {{ order.qty }}</p>
      <p>Status: <span class="status-badge">{{ order.status }}</span></p>
    </div>
    <div class="order-actions">
      <label class="action-label">Update status</label>
      <select [value]="order.status" (change)="updateStatus(order, $any($event.target).value)">
        <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
      </select>
    </div>
  </div>
</div>
